# seeds: the beads-compatible work tracker for the quipu stack (`sd`), aegis-1i5h1j.
# Digests are the published SHA256SUMS.txt lines for seeds-ai-v0.0.2, each
# re-derived by downloading and hashing the asset (all four matched). Bump with
# `caboodle bump-member members/seeds.toml`; never edit a digest by hand.
name = "seeds"
kind = "rust-release"
repo = "scbrown/seeds"
version = "0.2.6"
tag = "seeds-ai-v{version}"
asset = "sd-{tag}-{target}.tar.gz"
version_argv = ["--version"]
sums_asset = "SHA256SUMS.txt"
profiles = ["crew", "everything"]

[sha256]
aarch64-apple-darwin = "af9c7f49810d4faa5dafb2533f104044faae039737cbfdde4cb852a6880ab28d"
aarch64-unknown-linux-gnu = "eeee7cd87812b5a3e118edf19535a63c3d7709d93fbac3d194243408d455fc97"
x86_64-apple-darwin = "29c393c69f1b228d0fc49227ddfa85ba39670d7e581d1f7180db17b4dff57d12"
x86_64-unknown-linux-gnu = "1695577f39c0b2e74a2528037da041c2a4f607b3e91d10fddc2515354148e3c5"

# `sd` also names chmln/sd (find and replace). Identity is the --help text, which
# every released seeds carries ("seeds is the beads-compatible tracker ..."),
# not the "(seeds)" version suffix, which only releases after 0.0.2 print: the
# identity must match the OLDEST installed seeds or its first upgrade is refused.
[[programs]]
name = "sd"
identity_argv = ["--help"]
identity_contains = "seeds is the beads-compatible tracker"

# In the hermetic root, sd uses a local store at ./.seeds/seeds.db (created on
# the first write), so nothing touches the user's ledger or config.
[[verify]]
argv = ["sd", "list", "--all"]
absent = "{marker}"

[[verify]]
argv = ["sd", "create", "{marker}"]

[[verify]]
argv = ["sd", "list", "--all"]
present = "{marker}"
