name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Require tag to match Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Build archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target '${{ matrix.target }}'
          archive="tambo-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz"
          mkdir dist
          tar -czf "dist/$archive" -C 'target/${{ matrix.target }}/release' tambo caboodle
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "$archive" > "$archive.sha256")
          else
            (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify complete release metadata
        env:
          CABOODLE_EXPECT_TARGETS: x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin
        run: scripts/check-release-assets.sh "$GITHUB_REF_NAME" dist
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  publish-crate:
    name: Publish Tambo through crates.io Trusted Publishing
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the canonical repository and matching tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = scbrown/tambo
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tambo") | .version')
          test "$GITHUB_REF_NAME" = "v$version"
          echo "TAMBO_PUBLISH_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and verify the registry package
        run: cargo package --locked -p tambo
      - name: Check whether the account bootstrap already published this version
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          if scripts/check-crate-version.sh tambo "$TAMBO_PUBLISH_VERSION"; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            rc=$?
            test "$rc" = 1
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.registry.outputs.already != 'true'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1
      - name: Publish the verified package
        if: steps.registry.outputs.already != 'true'
        run: cargo publish --locked -p tambo
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - name: Verify registry visibility
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if scripts/check-crate-version.sh tambo "$TAMBO_PUBLISH_VERSION"; then
              exit 0
            fi
            test "$attempt" = 10 || sleep 15
          done
          echo 'Registry visibility is UNKNOWN; publication is not accepted.' >&2
          exit 1
