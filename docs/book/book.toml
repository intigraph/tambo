[book]
title = "Tambo"
description = "The whole kit — one wizard that installs the stack, proves it works, and watches it run"
authors = ["Steve Brown"]
language = "en"
src = "src"

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
# Keep working GitHub alias links until the repository rename is verified.
git-repository-url = "https://github.com/scbrown/caboodle"
edit-url-template = "https://github.com/scbrown/caboodle/edit/main/docs/book/{path}"
additional-css = ["custom/css/custom.css"]
site-url = "/tambo/"

[output.html.search]
enable = true
