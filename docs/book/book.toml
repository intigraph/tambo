[book]
title = "Tambo"
description = "The whole kit — one wizard that installs the stack, proves it works, and watches it run"
authors = ["Steve Brown"]
language = "en"
src = "src"

[output.html]
default-theme = "coal"
preferred-dark-theme = "coal"
# Canonical source links for the published Tambo book.
git-repository-url = "https://github.com/scbrown/tambo"
edit-url-template = "https://github.com/scbrown/tambo/edit/main/docs/book/{path}"
additional-css = ["custom/css/custom.css"]
site-url = "/tambo/"

[output.html.search]
enable = true
