# Test-only stack member (compiled in only with the fixture-members feature).
# Its release asset is the committed tests/fixtures/releases tarball, pinned here.
name = "fixture-demo"
kind = "rust-release"
repo = "tambo-fixtures/fixture-demo"
version = "0.1.0"
tag = "v{version}"
asset = "fixture-demo-{tag}-{target}.tar.gz"
version_argv = ["--version"]
sums_asset = "SHA256SUMS.txt"
profiles = ["everything"]

[sha256]
x86_64-unknown-linux-gnu = "f1d7a9409b8782d067e5086fafda8505680c39cf61b6e692c7c286e511fcca9c"

[[programs]]
name = "fixture-demo"
identity_argv = ["--help"]
identity_contains = "fixture-demo is the tambo fixture stack member"

[[verify]]
argv = ["fixture-demo", "list"]
absent = "{marker}"

[[verify]]
argv = ["fixture-demo", "add", "{marker}"]

[[verify]]
argv = ["fixture-demo", "list"]
present = "{marker}"
